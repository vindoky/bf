name: Scraper
on:
  schedule:
    - cron: "26 2,5,8,11,14,17,20,23 * * *"   # Burkina Faso is UTC+0, no DST
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the tracker CSV back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # The multilingual sentence-transformers model is ~470 MB; cache it so
      # it isn't re-downloaded on every scheduled run.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          MISTRAL_API_KEY:  ${{ secrets.MISTRAL_API_KEY }}
          WP_USERNAME:      ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:  ${{ secrets.WP_APP_PASSWORD }}
          WP_BASE_URL:      ${{ secrets.WP_BASE_URL }}
          INTERNAL_BOT_KEY: ${{ secrets.INTERNAL_BOT_KEY }}
        run: python bf.py

      - name: Commit updated tracker CSV
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_jobs_burkina_faso.csv
          git diff --cached --quiet || git commit -m "Update processed_jobs_burkina_faso.csv [skip ci]"
          git pull --rebase --autostash || true
          git push || true

      - name: Upload Excel output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-output-${{ github.run_id }}
          path: |
            jobs_output.xlsx
            processed_jobs_burkina_faso.csv
          retention-days: 7
